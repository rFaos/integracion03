# Library Desktop - direccion del gateway nginx (Sesion 08).
# La app solo conoce UNA direccion: la del reverse proxy. Las rutas se arman
# solas como <gateway>/api/<servicio> (login, books, users, autores, pedidos,
# pagos, rastreo). Tambien se cambia desde la pantalla de inicio de sesion.
#
# Local:        gateway=http://127.0.0.1:8080
# Google Cloud: gateway=http://<IP_EXTERNA_VM>:8080   (o solo la IP)
gateway=http://127.0.0.1:8080
