# URLs de los microservicios Library A TRAVES DEL REVERSE PROXY nginx (Sesion 08).
# La app ya no conoce los puertos 5000-5006: solo habla con el gateway en :8080
# y nginx reenvia /api/<servicio>/<ruta> -> servicio:<puerto>/<ruta>.
#
# Local (gateway en Docker Desktop):  http://127.0.0.1:8080/api/<servicio>
# Google Cloud:                        http://<IP_EXTERNA_VM>:8080/api/<servicio>
# (en Windows usa 127.0.0.1, no localhost)
login=http://127.0.0.1:8080/api/login
books=http://127.0.0.1:8080/api/books
users=http://127.0.0.1:8080/api/users
autores=http://127.0.0.1:8080/api/autores
pedidos=http://127.0.0.1:8080/api/pedidos
pagos=http://127.0.0.1:8080/api/pagos
# El WebSocket del rastreo tambien pasa por nginx: ws://127.0.0.1:8080/api/rastreo/ws/rastreo/<codigo>
rastreo=http://127.0.0.1:8080/api/rastreo
