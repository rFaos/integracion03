# ==============================================================================
# Upstreams para nginx en Docker Desktop (Windows/Mac) con los servicios
# corriendo en el host. "library-host" es un marcador que docker-start.sh
# reemplaza por la IPv4 de host.docker.internal. No se usa ese nombre directo
# porque Docker Desktop lo resuelve a IPv4 E IPv6 y nginx lo contaria como dos
# servidores por puerto; los servicios solo escuchan IPv4 y fallaria con 502.
# ==============================================================================

upstream login_svc   { server library-host:5000 max_fails=2 fail_timeout=10s; keepalive 16; }

upstream books_svc {
    # zone = estado compartido entre workers: el round robin y los fallos se
    # cuentan una sola vez para todo nginx, no por proceso.
    zone books_svc 64k;
    server library-host:5001 max_fails=2 fail_timeout=10s;
    server library-host:6001 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

upstream users_svc   { server library-host:5002 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream autores_svc { server library-host:5003 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream pedidos_svc { server library-host:5004 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream pagos_svc   { server library-host:5005 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream rastreo_svc { server library-host:5006 max_fails=2 fail_timeout=10s; }
