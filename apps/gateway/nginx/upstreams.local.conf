# ==============================================================================
# Upstreams para nginx instalado en la MISMA maquina que los servicios
# (VM de Google Cloud con Debian/Ubuntu, o nginx para Windows).
# Los servicios escuchan solo en 127.0.0.1: el unico puerto expuesto es el 8080.
# ==============================================================================
# max_fails / fail_timeout: tras 2 fallos la instancia sale de rotacion 10 s (RF4).
# keepalive: reutiliza conexiones con los servicios (menos latencia).

upstream login_svc   { server 127.0.0.1:5000 max_fails=2 fail_timeout=10s; keepalive 16; }

upstream books_svc {
    # zone = estado compartido entre workers: el round robin y los fallos se
    # cuentan una sola vez para todo nginx, no por proceso.
    zone books_svc 64k;
    # Round robin (por turnos) entre dos instancias del servicio de libros (RF3).
    server 127.0.0.1:5001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:6001 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

upstream users_svc   { server 127.0.0.1:5002 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream autores_svc { server 127.0.0.1:5003 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream pedidos_svc { server 127.0.0.1:5004 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream pagos_svc   { server 127.0.0.1:5005 max_fails=2 fail_timeout=10s; keepalive 16; }
upstream rastreo_svc { server 127.0.0.1:5006 max_fails=2 fail_timeout=10s; }
