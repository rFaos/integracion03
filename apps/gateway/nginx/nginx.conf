# ==============================================================================
# nginx.conf principal del Library API Gateway
# ==============================================================================
# Carga los upstreams (direcciones de los servicios) y despues la tabla de
# rutas. En Docker se monta upstreams.docker.conf como /etc/nginx/upstreams.conf;
# en la VM de GCP se copia upstreams.local.conf a ese mismo nombre.
# ==============================================================================

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;      # no anunciar la version de nginx

    include /etc/nginx/upstreams.conf;
    include /etc/nginx/conf.d/library_gateway.conf;
}
