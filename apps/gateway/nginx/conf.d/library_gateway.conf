# ==============================================================================
# Library API Gateway - Reverse Proxy con nginx (SC3705, Sesion 08)
# ==============================================================================
# Punto UNICO de entrada para las apps de escritorio (Electron, Python/Tk, Java).
#
#   cliente -> http://<host>:8080/api/<servicio>/<ruta>
#   nginx   -> http://<upstream>/<ruta>        (el prefijo /api/<servicio> se quita)
#
# El prefijo se elimina gracias a la BARRA FINAL en proxy_pass: el servicio
# recibe exactamente la ruta que ya conoce, asi que las apps solo cambian su
# URL base (estilo A de la presentacion, cero cambios de logica).
#
# Las direcciones reales de los servicios (upstreams) viven en otro archivo
# (upstreams.*.conf) para usar la MISMA configuracion en Docker, en Windows y en
# la VM de Google Cloud.
# ==============================================================================

# --- X-Request-ID: se respeta el que mande el cliente o se genera uno ----------
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# --- WebSocket (rastreo GPS de la app Java) ------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# --- Limite de tasa por IP -----------------------------------------------------
# api:   trafico general de las apps (catalogo, pedidos, etc.).
# login: mas estricto, frena fuerza bruta contra /login y /register.
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_status 429;

# --- Registro: una linea por peticion ------------------------------------------
# request_id, metodo, ruta, upstream (instancia) que respondio, codigo y tiempos.
log_format gateway '$time_iso8601 rid=$req_id ip=$remote_addr '
                   '"$request" status=$status '
                   'upstream=$upstream_addr up_status=$upstream_status '
                   'rt=${request_time}s urt=${upstream_response_time}s';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/gateway_access.log gateway;

    # Cuerpos de hasta 10 MB (portadas, cargas de la app web).
    client_max_body_size 10m;

    # --- Timeouts (RF6) --------------------------------------------------------
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # --- Reintento en otra instancia si una falla (RF4) ------------------------
    # Solo para errores de conexion/timeout/502/503; nginx NO reintenta POST ni
    # PATCH (no idempotentes) salvo que se pida explicitamente.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # --- Cabeceras que se reenvian (RF2) ---------------------------------------
    # Authorization, Cookie y el cuerpo pasan intactos (nginx no los toca).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # El ID tambien regresa al cliente, para buscarlo en los logs (RF7).
    add_header X-Request-ID $req_id always;
    add_header X-Gateway    "library-nginx" always;
    # Instancia que atendio la peticion: deja ver el round robin desde el cliente.
    add_header X-Upstream   $upstream_addr always;

    # --- Errores uniformes en JSON con request_id (RF6) ------------------------
    # Solo aplican a errores GENERADOS por nginx (ruta desconocida, limite,
    # servicio caido, timeout). Los errores propios de cada servicio (401, 404
    # de un libro, 422...) pasan tal cual porque proxy_intercept_errors = off.
    error_page 404 = @err404;
    error_page 429 = @err429;
    error_page 502 503 = @err503;
    error_page 504 = @err504;

    location @err404 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        return 404 '{"error":"NOT_FOUND","message":"Ruta desconocida en el gateway. Use /api/<servicio>/...","request_id":"$req_id"}';
    }
    location @err429 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        add_header Retry-After 1 always;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"Demasiadas solicitudes, intente de nuevo en un momento.","request_id":"$req_id"}';
    }
    location @err503 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"El servicio no esta disponible en este momento.","upstream":"$upstream_addr","request_id":"$req_id"}';
    }
    location @err504 {
        default_type application/json;
        add_header X-Request-ID $req_id always;
        return 504 '{"error":"GATEWAY_TIMEOUT","message":"El servicio tardo demasiado en responder.","upstream":"$upstream_addr","request_id":"$req_id"}';
    }

    # --- Salud del propio gateway ----------------------------------------------
    # La salud de cada servicio se consulta a traves del gateway:
    #   /api/books/health, /api/login/health, ...
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx","port":8080,"request_id":"$req_id","services":["login","books","users","autores","pedidos","pagos","rastreo"]}';
    }

    location = / {
        default_type application/json;
        return 200 '{"name":"Library API Gateway","routes":{"/api/login/":"login :5000","/api/books/":"books :5001 + :6001 (round robin)","/api/users/":"users :5002","/api/autores/":"autores :5003","/api/pedidos/":"pedidos :5004","/api/pagos/":"pagos :5005","/api/rastreo/":"rastreo :5006 (HTTP + WebSocket)"},"health":"/health"}';
    }

    # --- Tabla de rutas (RF1) --------------------------------------------------
    # La barra final de proxy_pass quita el prefijo /api/<servicio>.
    location /api/login/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://login_svc/;
    }

    location /api/books/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://books_svc/;          # 2 instancias, round robin (RF3)
    }

    location /api/users/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://users_svc/;
    }

    location /api/autores/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://autores_svc/;
    }

    location /api/pedidos/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://pedidos_svc/;
    }

    location /api/pagos/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://pagos_svc/;
    }

    location /api/rastreo/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://rastreo_svc/;
        # El WebSocket del rastreo GPS vive mucho tiempo: sin esto nginx lo
        # cerraria a los 10 s del proxy_read_timeout general.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Cualquier otra ruta -> 404 JSON.
    location / {
        return 404;
    }
}
